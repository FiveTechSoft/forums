name: Fix server

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check phpBB error log
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            echo "=== PHP error log (last 30 lines) ==="
            tail -30 /home4/fivetech/public_html/forums/phpbb/error_log 2>/dev/null || echo "no error_log"
            echo ""
            echo "=== phpBB log (last 30 lines) ==="
            tail -30 /home4/fivetech/public_html/forums/cache/logs/ 2>/dev/null || echo "no logs dir"
            echo ""
            echo "=== cache dir contents ==="
            ls -la /home4/fivetech/public_html/forums/cache/ 2>/dev/null | head -20
            echo ""
            echo "=== test index.php directly ==="
            curl -sL -m 15 -H "Host: www.fivetechsoft.com" "http://127.0.0.1/forums/index.php" -o /tmp/idx.html -w "http_code=%{http_code} size=%{size_download}\n"
            head -c 1000 /tmp/idx.html; echo
          ' 2>&1
