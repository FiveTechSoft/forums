name: Fix server

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find missing phpBB files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            FORUM=/home4/fivetech/public_html/forums

            echo "=== vendor/phpbb structure ==="
            ls -la $FORUM/vendor/phpbb/ 2>/dev/null || echo "no vendor/phpbb/"

            echo "=== find cache service ==="
            find $FORUM -name "service.php" -path "*/cache/*" 2>/dev/null | head -10

            echo "=== Composer autoload classmap (cache entries) ==="
            grep -i "cache" $FORUM/vendor/composer/autoload_classmap.php 2>/dev/null | head -20 || echo "no classmap"

            echo "=== Composer autoload_psr4 ==="
            grep -i "phpbb" $FORUM/vendor/composer/autoload_psr4.php 2>/dev/null | head -10 || echo "no psr4"

            echo "=== container cache rebuild attempt ==="
            cd $FORUM
            php bin/phpbbcli.php cache:purge 2>&1 | head -20

            echo "=== after purge test ==="
            curl -sL -m 15 -H "Host: www.fivetechsoft.com" "http://127.0.0.1/forums/" -o /tmp/after.html -w "http_code=%{http_code} size=%{size_download}\n"
            head -c 1500 /tmp/after.html; echo
          ' 2>&1
