name: Fix server

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebuild phpBB cache
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            echo "=== phpBB version ==="
            grep "phpbb_version" /home4/fivetech/public_html/forums/phpbb/version.rb 2>/dev/null || grep "PHPBB_VERSION" /home4/fivetech/public_html/forums/include/constants.php 2>/dev/null || grep "phpbb_version" /home4/fivetech/public_html/forums/config.php 2>/dev/null || echo "checking composer..."
            cat /home4/fivetech/public_html/forums/composer.json 2>/dev/null | grep -i version || echo "no version in composer.json"
            echo ""
            echo "=== check if there is a cli ==="
            ls /home4/fivetech/public_html/forums/bin/ 2>/dev/null || echo "no bin dir"
            echo ""
            echo "=== check PHP version ==="
            php -v 2>/dev/null | head -1 || echo "no php cli"
            echo ""
            echo "=== purge cache by removing cache files ==="
            rm -rf /home4/fivetech/public_html/forums/cache/production/*
            echo "cache purged"
            echo ""
            echo "=== test render after cache purge ==="
            curl -sL -m 15 -H "Host: www.fivetechsoft.com" "http://127.0.0.1/forums/" -o /tmp/after.html -w "http_code=%{http_code} size=%{size_download}\n"
            head -c 1000 /tmp/after.html; echo
          ' 2>&1
