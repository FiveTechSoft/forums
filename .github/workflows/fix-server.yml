name: Fix server

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify forum renders after fix
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            echo "=== cache driver files ==="
            ls -la /home4/fivetech/public_html/forums/phpbb/cache/driver/
            echo ""
            echo "=== test with -L (follow redirects) ==="
            curl -sL -m 15 -H "Host: www.fivetechsoft.com" "http://127.0.0.1/forums/" -o /tmp/after.html -w "http_code=%{http_code} size=%{size_download}\n"
            echo ""
            echo "=== first 800 chars ==="
            head -c 800 /tmp/after.html; echo
            echo ""
            echo "=== check for phpBB markers ==="
            grep -oi "phpbb\|powered by\|active.topics\|error" /tmp/after.html | head -20
          ' 2>&1
