name: Fix server

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore + diagnose
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          BASE="https://raw.githubusercontent.com/phpbb/phpbb/master/phpBB/phpbb/cache/driver"

          echo "=== re-download correct master-branch files ==="
          curl -sL "$BASE/file.php" -o /tmp/file.php
          curl -sL "$BASE/base.php" -o /tmp/base.php
          curl -sL "$BASE/driver_interface.php" -o /tmp/driver_interface.php
          echo "sizes: file=$(wc -c < /tmp/file.php) base=$(wc -c < /tmp/base.php) iface=$(wc -c < /tmp/driver_interface.php)"

          echo "=== upload ==="
          sshpass -e scp $SSH_OPTS /tmp/file.php "$SERVER_USER@$SERVER_HOST:/home4/fivetech/public_html/forums/phpbb/cache/driver/file.php"
          sshpass -e scp $SSH_OPTS /tmp/base.php "$SERVER_USER@$SERVER_HOST:/home4/fivetech/public_html/forums/phpbb/cache/driver/base.php"
          sshpass -e scp $SSH_OPTS /tmp/driver_interface.php "$SERVER_USER@$SERVER_HOST:/home4/fivetech/public_html/forums/phpbb/cache/driver/driver_interface.php"

          echo "=== full diagnostic ==="
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            FORUM=/home4/fivetech/public_html/forums

            echo "--- file sizes ---"
            wc -c $FORUM/phpbb/cache/driver/*.php

            echo "--- container cache files ---"
            ls -la $FORUM/cache/production/container_* 2>/dev/null | head -5 || echo "no container files"

            echo "--- autoload classmap check for cache\\driver\\file ---"
            grep "cache.*driver.*file" $FORUM/cache/production/autoload_classmap.php 2>/dev/null | head -3 || echo "not in classmap"

            echo "--- check vendor phpbb cache files ---"
            ls $FORUM/vendor/phpbb/cache/ 2>/dev/null || echo "no vendor/phpbb/cache"
            find $FORUM/vendor -path "*/cache/driver/file.php" 2>/dev/null || echo "not in vendor"

            echo "--- PHP error after render ---"
            php -d display_errors=1 -r "
              ini_set(\"error_reporting\", E_ALL);
              ini_set(\"display_errors\", \"1\");
              ini_set(\"log_errors\", \"0\");
              chdir(\"$FORUM\");
              include(\"$FORUM/app.php\");
            " 2>&1 | head -30

            echo ""
            echo "--- phpbbcli version ---"
            cd $FORUM
            php bin/phpbbcli.php --version 2>&1 | head -5
          ' 2>&1
