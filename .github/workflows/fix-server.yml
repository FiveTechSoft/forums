name: Fix server

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deep vendor/autoload diagnostic
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            FORUM=/home4/fivetech/public_html/forums

            echo "=== autoload_psr4.php full ==="
            cat $FORUM/vendor/composer/autoload_psr4.php 2>/dev/null | head -30

            echo ""
            echo "=== autoload_real.php ==="
            cat $FORUM/vendor/composer/autoload_real.php 2>/dev/null | head -20

            echo ""
            echo "=== vendor dir listing ==="
            ls $FORUM/vendor/ 2>/dev/null

            echo ""
            echo "=== check phpbb/cache/ dir ==="
            ls $FORUM/phpbb/cache/ 2>/dev/null

            echo ""
            echo "=== check if container files exist anywhere ==="
            find $FORUM/cache -name "container_*" 2>/dev/null | head -10 || echo "none"

            echo ""
            echo "=== check Bluehost backups ==="
            ls /home4/fivetech/backups/ 2>/dev/null | head -10 || echo "no backups dir"
            find /home4/fivetech -maxdepth 2 -name "*.tar*" -o -name "*.zip" 2>/dev/null | head -10 || echo "no archives"

            echo ""
            echo "=== phpbbcli verbose test ==="
            cd $FORUM
            php -d display_errors=1 bin/phpbbcli.php --version 2>&1 | head -20
          ' 2>&1
