name: Fix server

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore from backup
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            FORUM=/home4/fivetech/public_html/forums

            echo "=== list backup contents (cache + vendor/phpbb) ==="
            cd "/home4/fivetech/forums backup"
            unzip -l forums_3314_new.zip 2>/dev/null | grep -E "cache/production/container|vendor/phpbb/phpbb/cache|phpbb/cache/service" | head -30

            echo ""
            echo "=== try phpBB-3.3.14.zip instead ==="
            unzip -l phpBB-3.3.14.zip 2>/dev/null | grep -E "cache/production/container|vendor/phpbb/phpbb/cache|phpbb/cache/service" | head -30
          ' 2>&1
