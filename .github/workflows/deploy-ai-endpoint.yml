name: Deploy AI endpoint

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Upload ai_endpoint.php via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          # Crear directorio
          curl -sS --max-time 30 \
            --user "$FTP_USER:$FTP_PASS" \
            --ftp-create-dirs \
            -T scripts/php-endpoint/ai_endpoint.php \
            "ftp://$FTP_HOST/www/forums/_ai/ai_endpoint.php"
          echo "Subido a /www/forums/_ai/ai_endpoint.php"
