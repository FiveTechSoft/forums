name: Check bot read tracking

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload + run check_track.php
        env:
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          SSH_PASS: ${{ secrets.SERVER2_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"

          FORUM="/home1/fivetec1/public_html/forums"

          echo "=== upload check_track.php ==="
          sshpass -e scp $SSH_OPTS "$GITHUB_WORKSPACE/scripts/php-endpoint/check_track.php" "$SSH_USER@$SSH_HOST:$FORUM/_ai/check_track.php" 2>&1

          echo ""
          echo "=== run check ==="
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "cd $FORUM && php _ai/check_track.php" 2>&1

          echo ""
          echo "=== cleanup ==="
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "rm -f $FORUM/_ai/check_track.php" 2>&1
