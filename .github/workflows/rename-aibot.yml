name: Rename AiBot

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rename bot on Server 1
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          echo "=== Rename AiBot on Server 1 ==="
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "cd /home4/fivetech/www/forums && php -r \"
          \\\$db = new mysqli('localhost', 'fivetech_antonio', 'SuperCandelax2019?', 'fivetech_forums2021');
          \\\$db->query(\\\"UPDATE phpbb_users SET username = 'AiBot', username_clean = 'aibot' WHERE user_id = 1581\\\");
          \\\$db->query(\\\"UPDATE phpbb_topics SET topic_last_poster_name = 'AiBot' WHERE topic_last_poster_id = 1581\\\");
          \\\$db->query(\\\"UPDATE phpbb_forums SET forum_last_poster_name = 'AiBot' WHERE forum_last_poster_id = 1581\\\");
          echo 'Server1 done: ' . \\\$db->affected_rows . ' rows affected';
          \\\$db->close();
          \"" 2>&1

      - name: Rename bot on Server 2
        env:
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          SSH_PASS: ${{ secrets.SERVER2_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          echo "=== Rename AiBot on Server 2 ==="
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "cd /home1/fivetec1/public_html/forums && php -r \"
          \\\$db = new mysqli('localhost', 'fivetec1_antonio', 'Marbella2026?', 'fivetec1_forums');
          \\\$db->query(\\\"UPDATE phpbb_users SET username = 'AiBot', username_clean = 'aibot' WHERE user_id = 6418\\\");
          \\\$db->query(\\\"UPDATE phpbb_topics SET topic_last_poster_name = 'AiBot' WHERE topic_last_poster_id = 6418\\\");
          \\\$db->query(\\\"UPDATE phpbb_forums SET forum_last_poster_name = 'AiBot' WHERE forum_last_poster_id = 6418\\\");
          echo 'Server2 done: ' . \\\$db->affected_rows . ' rows affected';
          \\\$db->close();
          \"" 2>&1
