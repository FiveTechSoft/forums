name: Backup fivetechsupport

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Full backup
        env:
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          SSH_PASS: ${{ secrets.SERVER2_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          FORUM="/home1/fivetec1/public_html/forums"

          echo "=== full config.php ==="
          cat "$FORUM/config.php"

          echo ""
          echo "=== parse DB credentials ==="
          DBNAME=$(grep -oP "\\$dbname\\s*=\\s*'\\K[^']*" "$FORUM/config.php" | head -1)
          DBUSER=$(grep -oP "\\$dbuser\\s*=\\s*'\\K[^']*" "$FORUM/config.php" | head -1)
          DBPASS=$(grep -oP "\\$dbpasswd\\s*=\\s*'\\K[^']*" "$FORUM/config.php" | head -1)
          DBHOST=$(grep -oP "\\$dbhost\\s*=\\s*'\\K[^']*" "$FORUM/config.php" | head -1)
          echo "DBNAME=$DBNAME"
          echo "DBUSER=$DBUSER"
          echo "DBPASS=$DBPASS"
          echo "DBHOST=$DBHOST"

          BACKUP_DIR="/home1/fivetec1/backups_pre_ai"
          mkdir -p "$BACKUP_DIR"

          echo ""
          echo "=== dump database ==="
          if [ -n "$DBNAME" ] && [ -n "$DBUSER" ]; then
            MYSQL_HOST_FLAG=""
            if [ -n "$DBHOST" ]; then MYSQL_HOST_FLAG="-h $DBHOST"; else MYSQL_HOST_FLAG="-h localhost"; fi
            mysqldump $MYSQL_HOST_FLAG -u "$DBUSER" -p"$DBPASS" "$DBNAME" > "$BACKUP_DIR/forums_db_$(date +%Y%m%d_%H%M%S).sql" 2>&1
            DUMP_SIZE=$(wc -c < "$BACKUP_DIR"/forums_db_*.sql 2>/dev/null | tail -1)
            echo "DB dump size: $DUMP_SIZE bytes"
          else
            echo "ERROR: could not parse DB credentials"
          fi

          echo ""
          echo "=== backup phpBB config + cache ==="
          cd "$FORUM"
          tar czf "$BACKUP_DIR/phpbb_config_cache_$(date +%Y%m%d_%H%M%S).tar.gz" config.php phpbb/cache/ cache/ 2>/dev/null || true
          echo "Files backup done: $(ls -la $BACKUP_DIR/*.tar.gz 2>/dev/null | tail -1)"

          echo ""
          echo "=== table stats ==="
          if [ -n "$DBNAME" ] && [ -n "$DBUSER" ]; then
            mysql $MYSQL_HOST_FLAG -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "SELECT COUNT(*) as topics FROM phpbb_topics; SELECT COUNT(*) as posts FROM phpbb_posts; SELECT COUNT(*) as users FROM phpbb_users;" 2>&1
          fi

          echo ""
          echo "=== existing bots ==="
          if [ -n "$DBNAME" ] && [ -n "$DBUSER" ]; then
            mysql $MYSQL_HOST_FLAG -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "SELECT user_id, username, user_type FROM phpbb_users WHERE user_type = 2;" 2>&1
          fi

          echo ""
          echo "=== phpBB version ==="
          cat "$FORUM/composer.json" 2>/dev/null | grep -A1 "phpbb-core" | head -3

          echo ""
          echo "=== all backups ==="
          ls -la "$BACKUP_DIR/"
          REMOTE
