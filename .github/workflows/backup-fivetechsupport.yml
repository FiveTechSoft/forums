name: Backup fivetechsupport

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Explore + backup
        env:
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          SSH_PASS: ${{ secrets.SERVER2_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          echo "=== whoami + pwd ==="
          whoami
          pwd

          echo ""
          echo "=== home contents ==="
          ls -la ~/
          ls -la ~/public_html/ 2>/dev/null | head -20
          ls -la ~/www/ 2>/dev/null | head -20

          echo ""
          echo "=== find config.php ==="
          find ~ -maxdepth 5 -name "config.php" 2>/dev/null

          echo ""
          echo "=== find phpbb dirs ==="
          find ~ -maxdepth 5 -type d -name "phpbb" 2>/dev/null

          echo ""
          echo "=== disk usage ==="
          du -sh ~/public_html/* 2>/dev/null | head -10
          REMOTE
