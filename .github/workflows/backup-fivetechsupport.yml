name: Backup fivetechsupport

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Full backup
        env:
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          SSH_PASS: ${{ secrets.SERVER2_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          FORUM="/home1/fivetec1/public_html/forums"

          echo "=== parse DB credentials ==="
          DBNAME=$(sed -n "s/.*\$dbname\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          DBUSER=$(sed -n "s/.*\$dbuser\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          DBPASS=$(sed -n "s/.*\$dbpasswd\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          DBHOST=$(sed -n "s/.*\$dbhost\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          if [ -z "$DBHOST" ]; then DBHOST="localhost"; fi
          echo "DBNAME=$DBNAME DBUSER=$DBUSER DBHOST=$DBHOST"

          BACKUP_DIR="/home1/fivetec1/backups_pre_ai"
          mkdir -p "$BACKUP_DIR"

          echo ""
          echo "=== dump database ==="
          mysqldump -h "$DBHOST" -u "$DBUSER" -p"$DBPASS" "$DBNAME" > "$BACKUP_DIR/forums_db_$(date +%Y%m%d_%H%M%S).sql" 2>&1
          DUMP_FILE=$(ls -t "$BACKUP_DIR"/forums_db_*.sql 2>/dev/null | head -1)
          DUMP_SIZE=$(wc -c < "$DUMP_FILE" 2>/dev/null)
          echo "DB dump: $DUMP_SIZE bytes -> $DUMP_FILE"

          if [ "$DUMP_SIZE" -lt 1000 ]; then
            echo "DB DUMP FAILED - showing error:"
            head -5 "$DUMP_FILE"
            echo ""
            echo "=== trying with -S socket ==="
            ls /var/run/mysqld/mysqld.sock 2>/dev/null || ls /tmp/mysql.sock 2>/dev/null || echo "no socket found"
            mysqldump -u "$DBUSER" -p"$DBPASS" "$DBNAME" > "$BACKUP_DIR/forums_db_$(date +%Y%m%d_%H%M%S)_nosock.sql" 2>&1
            DUMP_FILE2=$(ls -t "$BACKUP_DIR"/forums_db_*_nosock.sql 2>/dev/null | head -1)
            DUMP_SIZE2=$(wc -c < "$DUMP_FILE2" 2>/dev/null)
            echo "DB dump (no host): $DUMP_SIZE2 bytes"
            if [ "$DUMP_SIZE2" -lt 1000 ]; then head -5 "$DUMP_FILE2"; fi
          fi

          echo ""
          echo "=== backup phpBB config + cache ==="
          cd "$FORUM"
          tar czf "$BACKUP_DIR/phpbb_config_cache_$(date +%Y%m%d_%H%M%S).tar.gz" config.php phpbb/cache/ cache/ 2>/dev/null || true
          echo "Files backup: $(ls -la $BACKUP_DIR/*.tar.gz 2>/dev/null | tail -1)"

          echo ""
          echo "=== table stats ==="
          mysql -h "$DBHOST" -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "SELECT COUNT(*) as topics FROM phpbb_topics; SELECT COUNT(*) as posts FROM phpbb_posts; SELECT COUNT(*) as users FROM phpbb_users;" 2>&1

          echo ""
          echo "=== existing bots ==="
          mysql -h "$DBHOST" -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "SELECT user_id, username, user_type FROM phpbb_users WHERE user_type = 2;" 2>&1

          echo ""
          echo "=== phpBB version ==="
          cat "$FORUM/composer.json" 2>/dev/null | grep -A1 "phpbb-core" | head -3

          echo ""
          echo "=== all backups ==="
          ls -la "$BACKUP_DIR/"
          REMOTE
