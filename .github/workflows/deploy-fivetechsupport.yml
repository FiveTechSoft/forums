name: Deploy fivetechsupport

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Upload + test run.php
        env:
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          SSH_PASS: ${{ secrets.SERVER2_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"

          FORUM="/home1/fivetec1/public_html/forums"

          echo "=== upload run_fts.php ==="
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p $FORUM/_ai" 2>&1
          sshpass -e scp $SSH_OPTS "$GITHUB_WORKSPACE/scripts/php-endpoint/run_fts.php" "$SSH_USER@$SSH_HOST:$FORUM/_ai/run.php" 2>&1

          echo ""
          echo "=== test run (1 reply) ==="
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "cd $FORUM && php _ai/run.php 1" 2>&1

          echo ""
          echo "=== verify last post ==="
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" bash -s <<'VERIFY'
          FORUM="/home1/fivetec1/public_html/forums"
          DBNAME=$(sed -n "s/.*\$dbname\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          DBUSER=$(sed -n "s/.*\$dbuser\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          DBPASS=$(sed -n "s/.*\$dbpasswd\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "SELECT post_id, topic_id, poster_id, LEFT(post_text, 200) as preview FROM phpbb_posts WHERE poster_id = 6418 ORDER BY post_time DESC LIMIT 3;" 2>/dev/null
          VERIFY
