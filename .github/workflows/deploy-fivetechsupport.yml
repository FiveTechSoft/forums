name: Deploy fivetechsupport

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create AiBot + deploy
        env:
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          SSH_PASS: ${{ secrets.SERVER2_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          FORUM="/home1/fivetec1/public_html/forums"

          DBNAME=$(sed -n "s/.*\$dbname\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          DBUSER=$(sed -n "s/.*\$dbuser\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          DBPASS=$(sed -n "s/.*\$dbpasswd\s*=\s*'\([^']*\)'.*/\1/p" "$FORUM/config.php" | head -1)
          echo "DB: $DBNAME user: $DBUSER"

          echo ""
          echo "=== existing bots ==="
          mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "SELECT user_id, username, user_type FROM phpbb_users WHERE user_type=2 LIMIT 10;" 2>/dev/null

          echo ""
          echo "=== check AiBot ==="
          AIBOT_CHECK=$(mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -N -e "SELECT user_id FROM phpbb_users WHERE username='AiBot [Bot]';" 2>/dev/null)
          echo "AiBot check: [$AIBOT_CHECK]"

          if [ -z "$AIBOT_CHECK" ]; then
            echo ""
            echo "=== creating AiBot user ==="
            mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "
              INSERT INTO phpbb_users (
                user_type, group_id, user_permissions, user_perm_from,
                user_regdate, user_lastmark, username, username_clean,
                user_password, user_email, user_email_hash,
                user_lastvisit, user_posts, user_warnings,
                user_lang, user_timezone, user_dateformat, user_style,
                user_notify_pm, user_allow_pm, user_allow_viewonline,
                user_show_smilies, user_allow_bbcode, user_allow_html,
                user_allow_smilies, user_board_legend, user_column_len
              ) VALUES (
                2, 5, '', 0,
                UNIX_TIMESTAMP(), UNIX_TIMESTAMP(), 'AiBot [Bot]', 'aibot [bot]',
                '', 'aibot@fivetechsoft.com', 0,
                0, 0, 0,
                'en', 0, 'D j M Y, H:i', 1,
                1, 0, 1,
                1, 1, 0,
                1, 0, 0
              );
            " 2>/dev/null

            AIBOT_ID=$(mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -N -e "SELECT user_id FROM phpbb_users WHERE username='AiBot [Bot]';" 2>/dev/null)
            echo "Created AiBot with ID: $AIBOT_ID"

            echo ""
            echo "=== set password hash ==="
            PASS_HASH='$2y$10$nVMFzAas5tl7bBC5Z5G4zuEfVmQx.lOJlBbKfV.UxQX6d4KzWC0Tu'
            mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "UPDATE phpbb_users SET user_password='$PASS_HASH' WHERE user_id=$AIBOT_ID;" 2>/dev/null

            echo "=== set bot group ==="
            mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "INSERT INTO phpbb_users_groups (user_id, group_id, group_leader) VALUES ($AIBOT_ID, 5, 0) ON DUPLICATE KEY UPDATE group_leader=0;" 2>/dev/null
          else
            echo "AiBot already exists with ID: $AIBOT_CHECK"
            AIBOT_ID="$AIBOT_CHECK"
          fi

          echo ""
          echo "=== verify final ==="
          mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "SELECT user_id, username, user_type FROM phpbb_users WHERE username='AiBot [Bot]';" 2>/dev/null

          echo ""
          echo "=== support forums ==="
          mysql -u "$DBUSER" -p"$DBPASS" "$DBNAME" -e "SELECT forum_id, forum_name, forum_posts_approved, forum_topics_approved FROM phpbb_forums ORDER BY forum_id;" 2>/dev/null
          REMOTE
