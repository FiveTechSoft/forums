name: Diag live server

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose from inside server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            echo "=== HEADERS INDEX (no follow) ==="
            curl -sk -m 30 --resolve www.fivetechsoft.com:443:127.0.0.1 -D - "https://www.fivetechsoft.com/forums/" -o /dev/null
            echo "=== HEADERS support root ==="
            curl -sk -m 30 --resolve forums.fivetechsupport.com:443:127.0.0.1 -D - "https://forums.fivetechsupport.com/" -o /dev/null
            echo "=== ACTIVE TOPICS soft ==="
            curl -sk -m 30 --resolve www.fivetechsoft.com:443:127.0.0.1 "https://www.fivetechsoft.com/forums/search.php?search_id=active_topics&cb=4" -o /tmp/at.html -w "http_code=%{http_code} size=%{size_download}\n"
            echo "gigabot count:"; grep -c -i "gigabot" /tmp/at.html
            echo "=== TOPIC TITLES ==="; grep -oP "(?<=topictitle\">)[^<]+" /tmp/at.html | head -12
            echo "=== ERROR LOGS ==="
            find /home4/fivetech/public_html -maxdepth 3 -name "error_log" -mtime -2 2>/dev/null | head -5
          ' 2>&1
