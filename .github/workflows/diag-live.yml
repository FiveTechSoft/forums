name: Diag live server

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose 500 from inside server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            echo "=== FOLLOW REDIRECT soft/forums ==="
            curl -sk -m 30 -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Host: www.fivetechsoft.com" "https://127.0.0.1/forums/" -o /tmp/soft.html -w "final=%{url_effective} http_code=%{http_code} size=%{size_download}\n"
            head -c 800 /tmp/soft.html; echo; echo "---"
            echo "=== ACTIVE TOPICS soft ==="
            curl -sk -m 30 -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Host: www.fivetechsoft.com" "https://127.0.0.1/forums/search.php?search_id=active_topics&cb=3" -o /tmp/at.html -w "http_code=%{http_code} size=%{size_download}\n"
            grep -c -i "gigabot" /tmp/at.html; grep -oP "(?<=topictitle\">)[^<]+" /tmp/at.html | head -12
            echo "=== ERROR LOGS ANY ==="
            find /home4/fivetech/logs /home4/fivetech/public_html -maxdepth 3 -name "*error*" -mtime -2 2>/dev/null | head
            tail -15 /home4/fivetech/public_html/error_log 2>/dev/null
          ' 2>&1
