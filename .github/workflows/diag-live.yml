name: Diag live server

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose 500 from inside server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            echo "=== RENDER /forums/ AS soft ==="
            curl -s -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Host: www.fivetechsoft.com" "http://127.0.0.1/forums/" -o /tmp/soft.html -w "http_code=%{http_code} size=%{size_download}\n"
            head -c 600 /tmp/soft.html; echo
            echo "=== RENDER support root ==="
            curl -s -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Host: forums.fivetechsupport.com" "http://127.0.0.1/" -o /tmp/sup.html -w "http_code=%{http_code} size=%{size_download}\n"
            echo "=== RECENT ERROR LOGS ==="
            find /home4/fivetech -maxdepth 4 -name "error_log" -mmin -120 2>/dev/null | head -10
            for f in $(find /home4/fivetech -maxdepth 4 -name "error_log" -mmin -120 2>/dev/null | head 3); do echo "--- $f"; tail -20 "$f"; done
          ' 2>&1
