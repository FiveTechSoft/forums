name: Diag live server

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose from inside server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" '
            echo "=== HTTP (not HTTPS) with correct Host ==="
            curl -s -m 15 -H "Host: www.fivetechsoft.com" "http://127.0.0.1/forums/" -o /tmp/h1.html -w "soft_http: code=%{http_code} size=%{size_download}\n"
            head -c 300 /tmp/h1.html; echo
            echo "=== HTTP fivetechsupport ==="
            curl -s -m 15 -H "Host: forums.fivetechsupport.com" "http://127.0.0.1/" -o /tmp/h2.html -w "support_http: code=%{http_code} size=%{size_download}\n"
            head -c 300 /tmp/h2.html; echo
            echo "=== PHP error log ==="
            cat /home4/fivetech/public_html/forums/phpbb/error_log 2>/dev/null | tail -20
            cat /home4/fivetech/public_html/forums/error_log 2>/dev/null | tail -20
            echo "=== Apache error log ==="
            tail -20 /home4/fivetech/logs/error_log 2>/dev/null
            echo "=== cpanel domains ==="
            cat /etc/trueuserdomains 2>/dev/null
            echo "=== domains dir ==="
            ls /var/cpanel/userdata/fivetech/ 2>/dev/null
          ' 2>&1
