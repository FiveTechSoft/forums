name: AI forum replies

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Max respuestas en esta ejecucion"
        default: "3"

permissions:
  contents: write

concurrency:
  group: ai-forum-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and run on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          MAX_REPLIES: ${{ github.event.inputs.max || '3' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o KexAlgorithms=+diffie-hellman-group-exchange-sha256"
          # Upload run.php
          sshpass -e scp $SSH_OPTS scripts/php-endpoint/run.php "$SERVER_USER@$SERVER_HOST:/home4/fivetech/www/forums/_ai/run.php"
          # Temp diag: extract exact active_topics SQL + visibility function
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" 'SP=/home4/fivetech/public_html/forums/search.php; ln=$(grep -n "case .active_topics" $SP | head -1 | cut -d: -f1); echo "=== case active_topics at line $ln ==="; sed -n "${ln},$((ln+80))p" $SP'
          # Execute
          sshpass -e ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" "cd /home4/fivetech/www/forums/_ai && php run.php $MAX_REPLIES"
