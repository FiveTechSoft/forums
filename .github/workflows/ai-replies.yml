name: AI forum replies

on:
  schedule:
    # Cuatro veces al dia: 00:00, 06:00, 12:00 y 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Max respuestas en esta ejecucion"
        default: "3"

concurrency:
  group: ai-forum-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger AI endpoint on fivetechsupport.com
        env:
          AI_ENDPOINT_URL: ${{ secrets.AI_ENDPOINT_URL }}
          AI_ENDPOINT_KEY: ${{ secrets.AI_ENDPOINT_KEY }}
          MAX: ${{ github.event.inputs.max || '3' }}
        run: |
          HTTP=$(curl -sS -o result.json -w "%{http_code}" --max-time 600 \
            -X POST "$AI_ENDPOINT_URL?action=run&max=$MAX" \
            -H "X-AI-Key: $AI_ENDPOINT_KEY")
          echo "HTTP $HTTP"
          cat result.json
          test "$HTTP" = "200" || exit 1
