name: AI forum replies

on:
  schedule:
    # Cuatro veces al dia: 00:00, 06:00, 12:00 y 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Max respuestas en esta ejecucion"
        default: "3"

permissions:
  contents: write

concurrency:
  group: ai-forum-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Upload run.php to server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          local_path: ./scripts/php-endpoint/run.php
          remote_path: /home4/fivetech/www/forums/_ai/
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}

      - name: Execute AI replies on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          script: |
            cd /home4/fivetech/www/forums/_ai
            php run.php ${{ github.event.inputs.max || '3' }}
